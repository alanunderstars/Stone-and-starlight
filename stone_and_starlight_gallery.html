
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Stone & Starlight</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Playfair Display', serif;
            background-color: #0f0f0f;
            color: #f4f4f4;
        }
        header {
            background: #1a1a1a;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 10px;
            padding: 20px;
        }
        .gallery img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 0 10px #000;
        }
        nav {
            background: #1a1a1a;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #d1d1d1;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
        }
        nav a:hover {
            color: #ffffff;
        }
        footer {
            background: #111;
            padding: 20px;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>Stone & Starlight: Gallery</h1>
    </header>
    <nav>
        <a href="stone_and_starlight_homepage.html">Home</a>
        <a href="stone_and_starlight_gallery.html">Gallery</a>
        <a href="stone_and_starlight_about.html">About</a>
        <a href="stone_and_starlight_contact.html">Contact</a>
    </nav>
    <div class="gallery">
        <img src="https://images.unsplash.com/photo-1506748686214-e9df14d4d9d0?auto=format&fit=crop&w=800&q=80" alt="Mountains at dusk">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Seascape with glowing horizon">
        <img src="https://images.unsplash.com/photo-1470770903676-69b98201ea1c?auto=format&fit=crop&w=800&q=80" alt="Cliffs and crashing waves">
        <img src="https://images.unsplash.com/photo-1607746882042-944635dfe10e?auto=format&fit=crop&w=800&q=80" alt="Snowy path with trees">
        <img src="https://images.unsplash.com/photo-1531746790731-6c087fecd65a?auto=format&fit=crop&w=800&q=80" alt="Starry night over hills">
        <img src="https://images.unsplash.com/photo-1549880180-34d4b3b6f7c6?auto=format&fit=crop&w=800&q=80" alt="Lone tree in misty field">
