<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Stone & Starlight</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Playfair Display', serif;
            background-color: #0f0f0f;
            color: #f4f4f4;
        }
        header {
            background: #1a1a1a;
            padding: 20px;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2.5em;
        }
        nav {
            background: #1a1a1a;
            padding: 10px 0;
            text-align: center;
        }
        nav a {
            color: #d1d1d1;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
        }
        nav a:hover {
            color: #ffffff;
        }
        section {
            padding: 40px 20px;
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: none;
            border-radius: 4px;
            background-color: #1e1e1e;
            color: #f4f4f4;
            box-sizing: border-box;
        }
        button {
            background-color: #5e60ce;
            color: white;
            border: none;
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #7071d4;
        }
        footer {
            background: #111;
            padding: 20px;
            text-align: center;
            color: #777;
        }
    </style>
</head>
<body>
    <header>
        <h1>Contact</h1>
    </header>
    <nav>
        <a href="index.html">Home</a>
        <a href="stone_and_starlight_gallery.html">Gallery</a>
        <a href="stone_and_starlight_about.html">About</a>
        <a href="stone_and_starlight_contact.html">Contact</a>
    </nav>
    <section>
        <h2>Let's Connect</h2>
        <p>Whether you're interested in a print, a collaboration, or just want to share a story from the road — I'd love to hear from you.</p>
        <form>
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <textarea rows="5" placeholder="Your Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>
    <footer>

    </footer>
